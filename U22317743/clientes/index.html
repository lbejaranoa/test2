
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestión de Clientes</h1>
        <p>Administración de información de clientes</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Registrar cliente</h2>

            <form>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Ingrese el nombre">

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" placeholder="Ingrese el correo">

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="Ingrese el teléfono">

                <button type="submit">Registrar cliente</button>
            </form>
        </section>

        <section class="lista">
            <h2>Lista de clientes</h2>
            <p>Aún no hay clientes registrados.</p>
        </section>
    </main>
</body>
</html>
