<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Productos</title>
</head>
<body>

    <header>
        <h1>Módulo de Productos</h1>
        <p>Gestión de productos del sistema de pedidos</p>
    </header>

    <main>
        <section>
            <h2>Productos disponibles</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Hamburguesa</td>
                        <td>S/ 12.00</td>
                        <td>Comida</td>
                        <td>20</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Pizza</td>
                        <td>S/ 25.00</td>
                        <td>Comida</td>
                        <td>15</td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Gaseosa</td>
                        <td>S/ 5.00</td>
                        <td>Bebida</td>
                        <td>30</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
