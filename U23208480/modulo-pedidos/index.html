<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Pedidos - U23208480</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sistema de Pedidos</h1>
    <p>Integrante D · Módulo Pedidos · Juan Retuerto (U23208480)</p>
  </header>

  <main>
    <section class="formulario">
      <h2>Nuevo pedido</h2>
      <form id="form-pedido">
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" required>

        <label for="producto">Producto</label>
        <input type="text" id="producto" required>

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" value="1" required>

        <label for="precio">Precio unitario (S/)</label>
        <input type="number" id="precio" min="0" step="0.01" required>

        <button type="submit">Agregar pedido</button>
      </form>
    </section>

    <section class="lista">
      <h2>Pedidos registrados</h2>
      <table id="tabla-pedidos">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="total">Total general: S/ <span id="total-general">0.00</span></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
